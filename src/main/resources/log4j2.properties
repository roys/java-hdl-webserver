name=PropertiesConfig

appenders=console, file, hdl
appender.console.type=Console
appender.console.name=STDOUT
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=%highlight{[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %enc{%msg}{CRLF}%n}

# Logs roll over every day, at 100 MB and on startup. Rolled over logs older than 30 days are deleted.
appender.file.type=RollingFile
appender.file.name=LOGFILE
appender.file.fileName=${sys:hdlserver.logDir:-logs}/hdl-server.log
appender.file.filePattern=${sys:hdlserver.logDir:-logs}/hdl-server.%d{yyyy-MM-dd}-%i.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} %enc{%msg}{CRLF}%n
appender.file.policies.type=Policies
appender.file.policies.time.type=TimeBasedTriggeringPolicy
appender.file.policies.time.interval=1
appender.file.policies.time.modulate=true
appender.file.policies.size.type=SizeBasedTriggeringPolicy
appender.file.policies.size.size=100MB
appender.file.policies.startup.type=OnStartupTriggeringPolicy
appender.file.strategy.type=DefaultRolloverStrategy
appender.file.strategy.max=7
appender.file.strategy.delete.type=Delete
appender.file.strategy.delete.basePath=${sys:hdlserver.logDir:-logs}
appender.file.strategy.delete.maxDepth=1
appender.file.strategy.delete.fileName.type=IfFileName
appender.file.strategy.delete.fileName.glob=hdl-server.*.log
appender.file.strategy.delete.lastModified.type=IfLastModified
appender.file.strategy.delete.lastModified.age=30d

appender.hdl.type=RollingFile
appender.hdl.name=HDL
appender.hdl.fileName=${sys:hdlserver.logDir:-logs}/hdl-bus.log
appender.hdl.filePattern=${sys:hdlserver.logDir:-logs}/hdl-bus.%d{yyyy-MM-dd}-%i.log
appender.hdl.layout.type=PatternLayout
appender.hdl.layout.pattern=[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} %enc{%msg}{CRLF}%n
appender.hdl.policies.type=Policies
appender.hdl.policies.time.type=TimeBasedTriggeringPolicy
appender.hdl.policies.time.interval=1
appender.hdl.policies.time.modulate=true
appender.hdl.policies.size.type=SizeBasedTriggeringPolicy
appender.hdl.policies.size.size=100MB
appender.hdl.policies.startup.type=OnStartupTriggeringPolicy
appender.hdl.strategy.type=DefaultRolloverStrategy
appender.hdl.strategy.max=7
appender.hdl.strategy.delete.type=Delete
appender.hdl.strategy.delete.basePath=${sys:hdlserver.logDir:-logs}
appender.hdl.strategy.delete.maxDepth=1
appender.hdl.strategy.delete.fileName.type=IfFileName
appender.hdl.strategy.delete.fileName.glob=hdl-bus.*.log
appender.hdl.strategy.delete.lastModified.type=IfLastModified
appender.hdl.strategy.delete.lastModified.age=30d

rootLogger.level=info
rootLogger.appenderRefs=stdout, file
rootLogger.appenderRef.stdout.ref=STDOUT
rootLogger.appenderRef.file.ref=LOGFILE

logger.hdl.name=HDL
logger.hdl.level=debug
logger.hdl.additivity=false
logger.hdl.appenderRef.hdl.ref=HDL
