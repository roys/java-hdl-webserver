[versions]
kotlin = "2.4.21"
shadow = "9.6.1"
javalin = "7.2.3"
# Javalin 7.2.3 is built on Jetty 12.1.12; use the latest 12.1 patch release.
jetty = "12.1.14"
jackson = "2.22.4"
# The pages are still Velocity 1.7 templates until they move to JTE.
velocity = "1.7"
log4j = "2.26.1"
commons-lang = "2.6"
commons-collections = "3.2.2"
# Existing hdlserver.db files were written with MapDB 3.0.2.
mapdb = "3.0.2"
junit = "6.1.3"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jetty-bom = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jetty" }
jetty-ee10-bom = { module = "org.eclipse.jetty.ee10:jetty-ee10-bom", version.ref = "jetty" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
velocity = { module = "org.apache.velocity:velocity", version.ref = "velocity" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
commons-collections = { module = "commons-collections:commons-collections", version.ref = "commons-collections" }
mapdb = { module = "org.mapdb:mapdb", version.ref = "mapdb" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
