[versions]
kotlin = "2.4.21"
shadow = "9.6.1"
spark = "2.9.4"
spark-velocity = "2.7.1"
# Spark 2.9 is built on Jetty 9.4; its last free release. Goes away with Spark in milestone 2.
jetty9 = "9.4.58.v20250814"
log4j = "2.26.1"
commons-lang = "2.6"
commons-collections = "3.2.2"
# Existing hdlserver.db files were written with MapDB 3.0.2.
mapdb = "3.0.2"
json-simple = "1.1.1"
junit = "6.1.3"

[libraries]
spark-core = { module = "com.sparkjava:spark-core", version.ref = "spark" }
spark-velocity = { module = "com.sparkjava:spark-template-velocity", version.ref = "spark-velocity" }
jetty-bom = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jetty9" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-slf4j-impl = { module = "org.apache.logging.log4j:log4j-slf4j-impl", version.ref = "log4j" }
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
commons-collections = { module = "commons-collections:commons-collections", version.ref = "commons-collections" }
mapdb = { module = "org.mapdb:mapdb", version.ref = "mapdb" }
json-simple = { module = "com.googlecode.json-simple:json-simple", version.ref = "json-simple" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
