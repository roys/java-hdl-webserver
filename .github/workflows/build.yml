name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The build compiles for Java 17; the tests also run on newer Java.
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build -PtestJavaVersion=${{ matrix.java }}
      - uses: actions/upload-artifact@v7
        if: matrix.java == 17
        with:
          name: hdlserver
          path: build/libs/hdlserver-*.jar
          if-no-files-found: error

  # The runnable JAR must start on the lowest supported Java, and explain itself on older Java (8 and 11 ran 1.x).
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hdlserver
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
      - name: Too old Java gets a clear message
        run: |
          mv hdlserver-*.jar hdlserver-LATEST.jar
          for v in 8 11; do
            home_var="JAVA_HOME_${v}_X64"
            set +e
            "${!home_var}/bin/java" -cp hdlserver-LATEST.jar com.roysolberg.java.hdlserver.Application > out.txt 2>&1
            code=$?
            set -e
            cat out.txt
            test "$code" = 1
            grep -q "needs Java 17 or later" out.txt
            grep -q "needs Java 17 or later" logs/hdl-server.log
          done
      - name: --version checks without starting
        run: java -cp hdlserver-LATEST.jar com.roysolberg.java.hdlserver.Application --version
      - name: Start the server and call the API
        run: |
          java -cp hdlserver-LATEST.jar com.roysolberg.java.hdlserver.Application > server.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:4567/ && break; sleep 1; done
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"auth":"WRONG"}' http://localhost:4567/api/actions/1)
          cat server.log
          test "$status" = 401
