version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Existing hdlserver.db files were written with MapDB 3.0.2.
      - dependency-name: org.mapdb:mapdb
      # Spark 2.9 is built on Jetty 9.4. Goes away with Spark.
      - dependency-name: org.eclipse.jetty:jetty-bom
        versions: [">= 10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
